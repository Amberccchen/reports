<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#EFEDE8;--surface:#F8F7F4;--ink:#1D2125;--muted:#5D6166;--rule:#D3D0C9;--accent:#2D4C9C}
@media (prefers-color-scheme:dark){:root{--bg:#16191C;--surface:#1E2226;--ink:#E7E5E0;--muted:#9EA3A8;--rule:#33383D;--accent:#8EA8EC}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif;padding:48px 16px 80px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font:600 2rem/1.15 Georgia,serif;margin:0}
.c{color:var(--muted);font-size:.9rem;margin:0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
li a{display:flex;flex-direction:column;gap:4px;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;color:inherit;text-decoration:none}
li a:hover{border-color:var(--accent)}
.d{font:500 .75rem ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
b{font:600 1.1rem Georgia,serif;color:var(--accent)}
.s{color:var(--muted);font-size:.92rem}
</style></head><body><main>
<h1>__TITLE__</h1><p class="c">__COUNT__ report(s), newest first.</p>
<ul>__ITEMS__</ul>
</main></body></html>
